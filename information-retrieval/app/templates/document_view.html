{% extends "base.html" %}
{% block title %}{{ doc.title }}{% endblock %}
{% block content %}
<a href="{{ url_for('main.documents') }}">&larr; К списку документов</a>
<h1>{{ doc.title }}</h1>
<p class="muted">ID {{ doc.document_id }} · {{ doc.date }} {{ doc.time }}</p>
<div class="card">
    <p style="white-space: pre-wrap;">{{ doc.text }}</p>
</div>
{% endblock %}
